<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FM Transmitter Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; }
        .search-control { position: absolute; top: 10px; left: 50px; z-index: 1000; background: white; padding: 10px; border-radius: 5px; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .beta-popup { background: white; padding: 20px; border-radius: 8px; max-width: 400px; }
    </style>
</head>
<body>

    <div id="betaModal" class="modal-overlay">
        <div class="beta-popup">
            <h2>Beta Notice</h2>
            <p>Ver. 0.02 - Now loading from stations.json</p>
            <button onclick="document.getElementById('betaModal').style.display='none'">Close</button>
        </div>
    </div>

    <div class="search-control">
        <input type="text" id="inFreq" placeholder="Freq (MHz)">
        <input type="text" id="inPi" placeholder="PI Code">
        <button onclick="filterStations()">OK</button>
        <button onclick="resetMap()">Reset</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([60.0, 10.0], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

        var markers = [];

        // Helper: Convert Maidenhead Grid to Lat/Lng
        function gridToLatLng(grid) {
            grid = grid.toUpperCase();
            var lon = (grid.charCodeAt(0) - 65) * 20 - 180 + (grid.charCodeAt(2) - 48) * 2 + 1;
            var lat = (grid.charCodeAt(1) - 65) * 10 - 90 + (grid.charCodeAt(3) - 48) + 0.5;
            return [lat, lon];
        }

        // Load data from file
        fetch('stations.json')
            .then(response => response.json())
            .then(data => {
                data.forEach(s => {
                    var latlng = gridToLatLng(s.grid);
                    var marker = L.marker(latlng).addTo(map);
                    
                    marker.stationData = s;
                    marker.bindPopup(`<b>${s.location || 'Unknown'}</b><br>Freq: ${s.frequency} MHz<br>PI: ${s.pi_code || 'N/A'}`);
                    
                    markers.push(marker);
                });
            });

        function filterStations() {
            var f = document.getElementById('inFreq').value.trim();
            var p = document.getElementById('inPi').value.trim().toUpperCase();
            
            markers.forEach(m => {
                var s = m.stationData;
                var match = (f === "" || s.frequency === f) && (p === "" || (s.pi_code && s.pi_code.toUpperCase() === p));
                match ? m.addTo(map) : map.removeLayer(m);
            });
        }

        function resetMap() {
            markers.forEach(m => m.addTo(map));
        }
    </script>
</body>
</html>
